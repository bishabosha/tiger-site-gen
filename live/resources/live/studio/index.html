// Move every selected page into one run, preserving deck order rather than click order.
export function moveSelection(order, selection, destination, side = 'after') {
  const selected = new Set(selection);
  const moving = order.filter(name => selected.has(name));
  if (!moving.length || (destination != null && selected.has(destination))) return order;
  const remaining = order.filter(name => !selected.has(name));
  let position;
  if (side === 'start') position = 0;
  else if (side === 'end') position = remaining.length;
  else {
    position = remaining.indexOf(destination);
    if (position < 0 || !['before', 'after'].includes(side)) return order;
    if (side === 'after') position++;

  return [...remaining.slice(0, position), ...moving, ...remaining.slice(position)];
}
export function selectRange(order, selection, anchor, target, checked = true) {

  for (const name of range) if (checked) selected.add(name); else selected.delete(name);
  return selected;
}
export function validGroupOrder(order, files, groups) {
  const byName = new Map(files.map(file => [file.name, file]));
  const ranks = order.map(name => Math.max(0, groups.indexOf(byName.get(name)?.group)));
  return !ranks.some((rank, i) => i && rank < ranks[i - 1]);
}

const message = (text, error = false) => { $('notice').textContent = text; $('notice').classList.toggle('error', error); };

function applyOrder(next) {

  if (!frame) {

function loadThumbnailSource() {

function render() {

async function load(directory, discard = false) {

$('pasteEnd').onclick = () => pasteSelection(null, 'end');
$('close').onclick = () => $('detail').close();
document.addEventListener('keydown', event => {
  if (busy || !state || event.target.closest('textarea,input:not([type=checkbox]),[contenteditable]') || $('detail').open) return;
  if (event.key === 'Escape' && cutNames.length) { event.preventDefault(); cutNames = []; updateSelection(); message('Cut cancelled.'); }
  if (event.metaKey || event.ctrlKey) {
    const key = event.key.toLowerCase();
    if (key === 'a') { event.preventDefault(); selected = new Set(order); updateSelection(); }
    if (key === 'x' && selected.size) { event.preventDefault(); cutSelection(); }
    if (key === 'v' && cutNames.length) { const target = event.target.closest('.card')?.dataset.name; if (target) { event.preventDefault(); pasteSelection(target, 'after'); } }
  }
});
window.addEventListener('beforeunload', e => { if (changed()) { e.preventDefault(); e.returnValue = ''; } });
try {
  config = await api('/__author/config'); $('site').href = config.siteUrl;
  const tree = await api('/__author/tree');
  function branch(node, depth = 0) { const button = document.createElement('button'); button.dataset.path = node.path; button.style.paddingLeft = `${12 + depth * 12}px`; button.textContent = `${node.children.length ? '▾' : '▤'} ${node.name}${node.pages ? ` (${node.pages})` : ''}`; button.onclick = () => load(node.path); $('tree').append(button); node.children.forEach(child => branch(child, depth + 1)); }
  branch(tree); await load(config.directory); if (!config.directory) message('Choose a collection in the hierarchy.');
} catch (error) { message(error.message, true); }
}
</script>
